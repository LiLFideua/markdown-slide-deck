<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Slide Deck</title>
  <style>
    :root { color-scheme: dark; --bg:#111113; --slide:#f8fafc; --ink:#111827; --muted:#64748b; --accent:#2563eb; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:#111113; color:#f8fafc; font:15px/1.5 Inter, system-ui, sans-serif; }
    main { width:min(1240px, calc(100% - 24px)); margin:0 auto; padding:24px 0; display:grid; grid-template-columns:390px 1fr; gap:14px; }
    aside, .stage { border:1px solid #ffffff22; border-radius:8px; background:#ffffff10; overflow:hidden; }
    .tools { display:flex; gap:8px; flex-wrap:wrap; padding:10px; border-bottom:1px solid #ffffff1f; }
    button, select { border:1px solid #ffffff2b; border-radius:8px; background:#ffffff12; color:#f8fafc; padding:9px 11px; font:inherit; cursor:pointer; }
    textarea { width:100%; min-height:calc(100vh - 118px); border:0; resize:none; padding:14px; background:#0b0c10; color:#f8fafc; font:14px/1.45 ui-monospace, Consolas, monospace; outline:0; }
    .stage { min-height:calc(100vh - 48px); display:grid; grid-template-rows:1fr auto; }
    .slide { margin:24px; border-radius:8px; background:var(--slide); color:var(--ink); padding:clamp(24px, 6vw, 72px); display:flex; flex-direction:column; justify-content:center; box-shadow:0 24px 80px #0008; transition:opacity .2s, transform .2s; }
    .slide h1 { font-size:clamp(2.4rem, 7vw, 5.5rem); line-height:1; margin:0 0 20px; letter-spacing:0; }
    .slide h2 { font-size:clamp(1.8rem, 4vw, 3.4rem); margin:0 0 16px; }
    .slide p, .slide li { font-size:clamp(1.05rem, 2vw, 1.5rem); }
    .slide code { background:#e2e8f0; padding:2px 5px; border-radius:5px; }
    .slide pre { background:#0f172a; color:#e2e8f0; padding:16px; border-radius:8px; overflow:auto; }
    .footer { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; color:#cbd5e1; }
    @media (max-width:900px) { main { grid-template-columns:1fr; } textarea { min-height:260px; } .stage { min-height:560px; } }
  </style>
</head>
<body>
  <main>
    <aside>
      <div class="tools"><button id="prev">Prev</button><button id="next">Next</button><select id="theme"><option value="light">Light</option><option value="midnight">Midnight</option><option value="paper">Paper</option></select></div>
      <textarea id="md" spellcheck="false"></textarea>
    </aside>
    <section class="stage">
      <article class="slide" id="slide"></article>
      <div class="footer"><span id="count"></span><span>Use arrow keys</span></div>
    </section>
  </main>
  <script>
    const md = document.querySelector("#md"), slide = document.querySelector("#slide"), count = document.querySelector("#count");
    let slides = [], current = 0;
    md.value = `# Markdown Slide Deck\\n\\nTurn plain markdown into focused presentation slides.\\n\\n---\\n\\n## Features\\n\\n- Split slides with three dashes\\n- Navigate with buttons or arrow keys\\n- Switch themes instantly\\n\\n---\\n\\n## Code\\n\\n\`\`\`js\\nconst message = "ship useful tools";\\nconsole.log(message);\\n\`\`\``;
    function inline(text) { return text.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\\*\\*([^*]+)\\*\\*/g, "<strong>$1</strong>"); }
    function parseBlock(block) {
      const lines = block.trim().split("\\n"); let html = "", inCode = false, code = [];
      for (const line of lines) {
        if (line.startsWith("```")) { if (inCode) { html += `<pre><code>${code.join("\\n").replace(/[&<>]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;" }[c]))}</code></pre>`; code = []; } inCode = !inCode; continue; }
        if (inCode) { code.push(line); continue; }
        if (line.startsWith("# ")) html += `<h1>${inline(line.slice(2))}</h1>`;
        else if (line.startsWith("## ")) html += `<h2>${inline(line.slice(3))}</h2>`;
        else if (line.startsWith("- ")) html += `<li>${inline(line.slice(2))}</li>`;
        else if (line.trim()) html += `<p>${inline(line)}</p>`;
      }
      return html.replace(/(<li>.*<\/li>)/gs, "<ul>$1</ul>");
    }
    function render() {
      slides = md.value.split(/^---$/m).map(s => s.trim()).filter(Boolean);
      current = Math.min(current, slides.length - 1);
      slide.style.opacity = .2; slide.style.transform = "translateY(6px)";
      setTimeout(() => { slide.innerHTML = parseBlock(slides[current] || ""); count.textContent = `${current + 1} / ${slides.length}`; slide.style.opacity = 1; slide.style.transform = "translateY(0)"; }, 120);
    }
    function go(delta) { current = Math.max(0, Math.min(slides.length - 1, current + delta)); render(); }
    document.querySelector("#prev").onclick = () => go(-1); document.querySelector("#next").onclick = () => go(1);
    document.addEventListener("keydown", e => { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft") go(-1); });
    document.querySelector("#theme").onchange = e => {
      const themes = { light:["#f8fafc","#111827","#2563eb"], midnight:["#111827","#f8fafc","#38bdf8"], paper:["#fff7ed","#1c1917","#ea580c"] };
      const [bg,ink,accent] = themes[e.target.value]; document.documentElement.style.setProperty("--slide", bg); document.documentElement.style.setProperty("--ink", ink); document.documentElement.style.setProperty("--accent", accent);
    };
    md.addEventListener("input", render); render();
  </script>
</body>
</html>
